name: release

# Push a tag such as v1.7.0 (matching package.json) to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: node --test "test/*.test.js"
        env:
          DSH_LIBREOFFICE_CLI: none
      # prepack builds the client and the OCR helper from source.
      - run: pnpm pack --pack-destination dist
      # Also as dsh-doc-viewer.tgz, a stable link for people to download by hand. Installs should use
      # the versioned file: pnpm records its checksum, so its content must never change.
      - name: GitHub release with the package attached
        run: |
          cp dist/dsh-doc-viewer-*.tgz dist/dsh-doc-viewer.tgz
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
