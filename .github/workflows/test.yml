name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:ocr
      # CI has no DeepSeek Harness, so no LibreOffice; the tests cover both cases.
      - run: node --test "test/*.test.js"
        env:
          DSH_LIBREOFFICE_CLI: none
